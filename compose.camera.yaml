# Optional override that passes the host camera to the backend.
# Kept separate so that `docker compose up` also works on machines without a camera.
# Usage: docker compose -f docker-compose.yml -f compose.camera.yaml up --build
services:
  backend:
    devices:
      - /dev/video0:/dev/video0
    # The device keeps its host group ("video", gid 39 on Fedora); the non-root
    # backend user must be in that group to open the camera.
    # Check yours with: getent group video
    group_add:
      - "${VIDEO_GID:-39}"
