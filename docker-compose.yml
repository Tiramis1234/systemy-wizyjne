services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    # Run as the host user, so files saved to ./output belong to that user, not root.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./output:/app/output

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "4173:4173"
    depends_on:
      - backend
